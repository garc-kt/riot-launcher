on:
  push:
    branches:
      - main
      - dev
      - release/*
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-windows
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Prepare environment variables
        run: |
          echo "SHORT_SHA=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "APP_VERSION=`node -p "require('./loader/package.json').version"`" >> $GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "loader/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build preload plugins & companion app
        run: |
          pnpm build:plugins
          pnpm build:app

      - name: Build core (windows)
        run: msbuild.exe pengu.sln -t:build -p:Configuration=Release -p:Platform=x64

      - name: Build loader
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "loader"

      - name: Move loader output (windows)
        run: |
          mkdir -p bin
          if [ -f "loader/src-tauri/target/release/Riot Loader.exe" ]; then
            cp "loader/src-tauri/target/release/Riot Loader.exe" bin/
          elif [ -f "loader/src-tauri/target/release/riot-loader.exe" ]; then
            cp "loader/src-tauri/target/release/riot-loader.exe" bin/
          elif [ -f "loader/src-tauri/target/release/Pengu Loader.exe" ]; then
            cp "loader/src-tauri/target/release/Pengu Loader.exe" bin/
          elif [ -f "loader/src-tauri/target/release/pengu-loader.exe" ]; then
            cp "loader/src-tauri/target/release/pengu-loader.exe" bin/
          fi

      - name: Stage first-party companion app
        # @companion/ is a reserved namespace: both the C++ core's plugin
        # scanner and the loader's own gallery scanner only treat @<name>/
        # folders as plugin groups when they contain a further subfolder
        # (@author/plugin/index.js) — a bare @companion/index.js is invisible
        # to both, so it can never be listed or hash-disabled like a user
        # plugin. It's loaded directly by plugins/src/preload/loader.ts.
        run: |
          mkdir -p bin/plugins/@companion
          cp app/dist/index.js bin/plugins/@companion/index.js

      - name: Package Release Zip
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v${APP_VERSION}-dev-${SHORT_SHA}"
          fi
          ZIP_NAME="riot-loader-${TAG_NAME}-windows-x64.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd bin
          7z a "../bin/${ZIP_NAME}" "Riot Loader.exe" "core.dll" "plugins"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: riot-loader-v${{ env.APP_VERSION }}-dev-${{ env.SHORT_SHA }}-windows
          path: |
            bin/
            !bin/obj/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/${{ env.ZIP_NAME }}
            bin/Riot Loader.exe
            bin/core.dll
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
