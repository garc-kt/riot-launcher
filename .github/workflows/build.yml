on:
  push:
    branches:
      - main
      - dev
      - release/*
  workflow_dispatch:

jobs:
  build:
    name: build-windows
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Prepare environment variables
        run: |
          echo "SHORT_SHA=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "APP_VERSION=`node -p "require('./loader/package.json').version"`" >> $GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "loader/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: true

      - name: Run unit tests
        run: pnpm test

      - name: Build preload plugins & companion app
        run: |
          pnpm build:plugins
          pnpm build:app

      - name: Build core (windows)
        run: msbuild.exe pengu.sln -t:build -p:Configuration=Release -p:Platform=x64

      - name: Build loader
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "loader"

      - name: Move loader output (windows)
        run: |
          mkdir -p bin
          if [ -f "loader/src-tauri/target/release/Pengu Loader.exe" ]; then
            cp "loader/src-tauri/target/release/Pengu Loader.exe" bin/
          elif [ -f "loader/src-tauri/target/release/pengu-loader.exe" ]; then
            cp "loader/src-tauri/target/release/pengu-loader.exe" bin/
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: companion-loader-v${{ env.APP_VERSION }}-dev-${{ env.SHORT_SHA }}-windows
          path: |
            bin/
            !bin/obj/
